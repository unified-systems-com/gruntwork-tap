# Identity chain (pre-boot conformance gate enforces agreement):
#   slug = "gruntwork"  ·  distribution = "gruntwork-tap"  ·  import namespace = "tap_plugin.gruntwork"
#   entry-point key = "gruntwork"
[project]
name = "gruntwork-tap"
description = "Gruntwork infrastructure-as-code as grid vocabulary: v0 carries one outer node, the Gruntwork deployment (the account factory and infrastructure-live estate it manages), so a design can place it before anything is collected."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = []

[project.entry-points."tap.plugins"]
gruntwork = "tap_plugin.gruntwork.apps:GruntworkConfig"

# The plugin's OWN dev closure (PEP 735), so its suite runs in a bare checkout. Never installed by boot.
[dependency-groups]
dev = ["pytest>=8.3", "pytest-django>=4.9", "factory-boy>=3.3"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
only-include = ["tap_plugin/gruntwork"]
